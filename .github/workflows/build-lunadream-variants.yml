name: Build FujiFilm Mode Release APK
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:
  push:
    branches:
      - feature/lunadream-2.5.0dream
      - fix/2.5.0dream-af-label
      - fuji-2.5.0-round1-spec
    paths:
      - "CamUI-src/**"
      - ".github/workflows/build-lunadream-variants.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 37 and build tools
        run: |
          yes | sdkmanager --licenses --channel=3 >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" --channel=3
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build production Release APK
        id: build_release
        working-directory: CamUI-src
        run: |
          gradle --no-daemon :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/FujiFilm-Mode-2.5.0.apk

      - name: Verify Release APK identity
        working-directory: CamUI-src
        run: |
          APK="app/build/outputs/apk/release/FujiFilm-Mode-2.5.0.apk"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          BADGING=$("$AAPT" dump badging "$APK")
          PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p")
          VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p")
          echo "package=$PACKAGE versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          test "$PACKAGE" = "com.fujifilm.mode.developer"
          test "$VERSION_CODE" = "16"
          test "$VERSION_NAME" = "2.5.0"

      - name: Run supported unit tests
        working-directory: CamUI-src
        run: gradle --no-daemon :app:testDeveloperUnitTest --stacktrace

      - name: Upload Release APK
        if: success() && steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FujiFilm-Mode-Release-2.5.0
          path: CamUI-src/app/build/outputs/apk/release/FujiFilm-Mode-2.5.0.apk
          if-no-files-found: error
          retention-days: 14
