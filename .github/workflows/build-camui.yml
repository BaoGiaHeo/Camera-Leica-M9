name: Build FujiFilm Mode 2.0.2Dream
# Release pipeline for the portrait UI and LunaDream 2.0.1 capture paths.

on:
  push:
    branches: [main, "feature/fujifilm-mode-1.6"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and build debug + release APKs
        id: build_apks
        working-directory: CamUI-src
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify APK metadata and absence of bundled AI models
        working-directory: CamUI-src
        run: |
          python - <<'PY'
          import glob
          import zipfile

          debug_apks = glob.glob("app/build/outputs/apk/debug/*.apk")
          release_apks = glob.glob("app/build/outputs/apk/release/*.apk")
          assert debug_apks, "Debug APK was not produced"
          assert release_apks, "Release APK was not produced"
          for path in debug_apks + release_apks:
              with zipfile.ZipFile(path) as apk:
                  names = set(apk.namelist())
                  forbidden = [name for name in names if "nafnet" in name.lower() or "onnx" in name.lower()]
                  assert not forbidden, f"AI model payload still present in {path}: {forbidden}"
              print(f"Verified {path}")
          PY
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Cold-start smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set +e
            mkdir -p emulator-artifacts
            adb wait-for-device

            # Install and cold-launch the exact APK produced by this workflow before instrumentation.
            adb install -r CamUI-src/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.fujifilm.mode.debug android.permission.CAMERA
            adb logcat -c
            adb shell am force-stop com.fujifilm.mode.debug
            adb shell am start -W -n com.fujifilm.mode.debug/com.example.camui.MainActivity
            sleep 8
            adb shell dumpsys activity activities > emulator-artifacts/activity-portrait.txt
            adb exec-out screencap -p > emulator-artifacts/camera-portrait.png
            adb logcat -d -v threadtime -t 5000 > emulator-artifacts/logcat-portrait.txt

            # Rotate the emulator, verify its configuration, and capture the second UI state.
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 5
            adb shell dumpsys activity activities > emulator-artifacts/activity-landscape.txt
            adb exec-out screencap -p > emulator-artifacts/camera-landscape.png
            adb logcat -d -v threadtime -t 5000 > emulator-artifacts/logcat-landscape.txt

            # Run startup + orientation instrumentation with a hard timeout.
            timeout 240s gradle --no-daemon -p CamUI-src :app:connectedDebugAndroidTest --stacktrace --console=plain
            TEST_EXIT=$?
            adb logcat -d -v threadtime -t 10000 > emulator-artifacts/logcat-final.txt
            exit $TEST_EXIT

      - name: Upload emulator inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-inspection
          path: emulator-artifacts/
          if-no-files-found: warn

      - name: Upload 2.0.2Dream APKs
        if: always() && steps.build_apks.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FujiFilm-Mode-2.0.2Dream
          path: |
            CamUI-src/app/build/outputs/apk/debug/*.apk
            CamUI-src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
