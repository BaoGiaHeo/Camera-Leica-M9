name: Manual FujiFilm Mode Release APK (Developer diagnostics)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 platform 37.0
        run: |
          yes | sdkmanager --licenses --channel=3 >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Release APK
        working-directory: CamUI-src
        run: |
          gradle --no-daemon :app:assembleDeveloper
          cp app/build/outputs/apk/developer/app-developer.apk app/build/outputs/apk/developer/Release.apk

      - name: Upload Release.apk
        uses: actions/upload-artifact@v4
        with:
          name: FujiFilm-Mode-Release-2.5.0Dream
          path: CamUI-src/app/build/outputs/apk/developer/Release.apk
          if-no-files-found: error
          retention-days: 14
