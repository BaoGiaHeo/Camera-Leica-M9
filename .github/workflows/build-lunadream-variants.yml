name: Build LunaDream Debug and Developer APKs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lunadream-2.5.0dream
    paths:
      - "CamUI-src/**"
      - ".github/workflows/build-lunadream-variants.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        working-directory: CamUI-src
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug and Developer APKs
        working-directory: CamUI-src
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDeveloper

      - name: Run unit tests for both variants
        working-directory: CamUI-src
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:testDeveloperUnitTest

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaDream-2.5.0dream-Debug
          path: CamUI-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Developer APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaDream-2.5.0dream-Developer
          path: CamUI-src/app/build/outputs/apk/developer/app-developer.apk
          if-no-files-found: error
          retention-days: 14
