
name: Build Fujifilm Mode APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Apktool
        run: curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
      - name: Extract app project
        run: |
          mkdir -p decoded-project
          unzip -q app.zip -d decoded-project
          PROJECT_DIR=$(find decoded-project -type f -name apktool.yml -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/AndroidManifest.xml" ]; then
            echo "ERROR: Không tìm thấy dự án Apktool hợp lệ trong app.zip"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Camera2 ID and physical camera scanner
        run: |
          set -e
          mkdir -p "$PROJECT_DIR/smali_classes3/com/xcam/offline"
          cp patches/CameraIdScanner.smali "$PROJECT_DIR/smali_classes3/com/xcam/offline/CameraIdScanner.smali"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          root = Path(os.environ["PROJECT_DIR"])
          listeners = list(root.rglob("CameraInfoDialog$1.smali"))
          dialogs = list(root.rglob("CameraInfoDialog.smali"))
          if len(listeners) != 1 or len(dialogs) != 1:
              raise SystemExit("Expected one CameraInfoDialog listener and class")
          lp = listeners[0]
          ls = lp.read_text()
          old = "Lcom/xcam/offline/CameraInfoDialog;->show(Landroid/content/Context;)V"
          new = "Lcom/xcam/offline/CameraIdScanner;->show(Landroid/content/Context;)V"
          if ls.count(old) != 1:
              raise SystemExit("Could not safely locate camera info button action")
          lp.write_text(ls.replace(old, new, 1))
          dp = dialogs[0]
          ds = dp.read_text()
          old_label = '"Th\\u00f4ng s\\u1ed1 camera"'
          if ds.count(old_label) != 2:
              raise SystemExit("Expected the camera info button and dialog title labels")
          dp.write_text(ds.replace(old_label, '"CAMERA ID SCANNER"'))
          PY
      - name: Set testing app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['PROJECT_DIR']) / 'AndroidManifest.xml'
          s = p.read_text()
          a = s.index('<application')
          b = s.index('>', a)
          tag = s[a:b]
          import re
          tag, n = re.subn(r'android:label="[^"]*"', 'android:label="Fujifilm Mode (app-debug)"', tag, count=1)
          if n == 0:
              tag += ' android:label="Fujifilm Mode (app-debug)"'
          p.write_text(s[:a] + tag + s[b:])
          PY
      - name: Apply Fuji-inspired interface patch
        run: |
          set -e
          mkdir -p "$PROJECT_DIR/smali_classes3/com/xcam/offline"
          cp patches/FujiDesignFeature.smali "$PROJECT_DIR/smali_classes3/com/xcam/offline/FujiDesignFeature.smali"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes3/com/xcam/offline/MainActivity.smali"
          s = p.read_text()
          anchor = "    invoke-static {v6}, Lcom/xcam/offline/UiV111Feature;->install(Landroid/app/Activity;)V"
          patch = anchor + "\n    invoke-static {v6}, Lcom/xcam/offline/FujiDesignFeature;->install(Landroid/app/Activity;)V"
          if s.count(anchor) != 1:
              raise SystemExit("Could not safely locate the single UI installation point")
          p.write_text(s.replace(anchor, patch, 1))
          PY
      - name: Add hardware noise reduction OFF mode
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes3/com/xcam/offline/MainActivity.smali"
          s = p.read_text()

          def block_for(name):
              a = s.index(name)
              b = s.index(".end method", a)
              return a, b, s[a:b]

          # Persisted setting range.
          a, b, lines_block = block_for(".method private final loadSettings()V")
          ls = lines_block.splitlines()
          ix = [i for i,x in enumerate(ls) if "coerceIn(III)I" in x and "{v3, v1, v4}" in x]
          if len(ix) != 1:
              raise SystemExit("Denoise preference clamp not found uniquely")
          ls[ix[0]] = ls[ix[0]].replace("{v3, v1, v4}", "{v3, v1, v5}")
          ls.insert(ix[0], "    const/4 v5, 0x2")
          s = s[:a] + "\n".join(ls) + s[b:]

          # Add OFF to the existing three-choice builder.
          a, b, lines_block = block_for(".method private final showSettings()V")
          ls = lines_block.splitlines()
          ti = next((i for i,x in enumerate(ls) if '"Kh\\u1eed nhi\\u1ec5u \\u1ea3nh"' in x), -1)
          if ti < 0:
              raise SystemExit("Noise reduction section not found")
          si = next((i for i in range(ti, len(ls)) if ls[i].strip() == "const/4 v6, 0x2"), -1)
          bi = next((i for i in range(si + 1, len(ls)) if 'const-string v1, "Best"' in ls[i]), -1) if si >= 0 else -1
          ai = next((i for i in range(bi + 1, len(ls)) if ls[i].strip() == "aput-object v1, v0, v2"), -1) if bi >= 0 else -1
          if min(si, bi, ai) < 0:
              raise SystemExit("Noise reduction choices are not in expected structure")
          ls[si] = ls[si].replace("0x2", "0x3")
          ls[ai + 1:ai + 1] = ["", '    const-string v1, "T\\u1eaft"', "", "    const/4 v2, 0x2", "", "    aput-object v1, v0, v2"]
          s = s[:a] + "\n".join(ls) + s[b:]

          # Map setting index 2 to Camera2 OFF = 0; keep unsupported OFF from falling back to FAST.
          a, b, lines_block = block_for(".method private final resolveNoiseReductionMode(")
          ls = lines_block.splitlines()
          bi = next((i for i,x in enumerate(ls) if x.strip() == "if-ne v2, v4, :cond_1"), -1)
          ei = next((i for i in range(bi + 1, len(ls)) if ls[i].strip() == "move v2, v4"), -1) if bi >= 0 else -1
          if min(bi, ei) < 0:
              raise SystemExit("Camera2 denoise mode mapping not found")
          ls[bi:ei + 1] = [
              "    if-nez v2, :cond_denoise_nonzero", "",
              "    move v2, v4", "", "    goto :goto_0", "",
              "    :cond_denoise_nonzero", "",
              "    if-ne v2, v4, :cond_denoise_off", "",
              "    move v2, v3", "", "    goto :goto_0", "",
              "    :cond_denoise_off", "", "    const/4 v2, 0x0"
          ]
          ci = next((i for i,x in enumerate(ls) if x.strip() == ":cond_2"), -1)
          if ci < 0:
              raise SystemExit("Camera2 unsupported-mode branch not found")
          ls[ci + 1:ci + 1] = [
              "    iget v2, p0, Lcom/xcam/offline/MainActivity;->denoiseMode:I", "",
              "    const/4 v3, 0x2", "",
              "    if-ne v2, v3, :continue_denoise_fallback", "",
              "    return-object v0", "", "    :continue_denoise_fallback", ""
          ]
          s = s[:a] + "\n".join(ls) + s[b:]
          p.write_text(s)
          print("Camera2 OFF selection added.")
          PY
      - name: Localize camera settings and clarify output formats
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes3/com/xcam/offline/MainActivity.smali"
          s = p.read_text()
          replacements = {
              '"WATERMARK & FRAME"': '"WATERMARK & KHUNG ANH"',
              '"L\\u01b0u th\\u00eam PNG ch\\u01b0a \\u00e1p m\\u00e0u phim (kh\\u00f4ng ph\\u1ea3i RAW)"': '"L\\u01b0u th\\u00eam PNG g\\u1ed1c (kh\\u00f4ng ph\\u1ea3i RAW/DNG)"',
              '"\\u0110I\\u1ec0U KHI\\u1ec2N"': '"\\u0110I\\u1ec0U KHI\\u1ec2N CAMERA"',
              '"RAW/DNG: ch\\u01b0a \\u0111\\u01b0\\u1ee3c h\\u1ed7 tr\\u1ee3 trong pipeline CameraX n\\u00e0y"': '"RAW/DNG ch\\u01b0a \\u0111\\u01b0\\u1ee3c h\\u1ed7 tr\\u1ee3: hi\\u1ec7n t\\u1ea1i app ch\\u1ee5p JPEG b\\u1eb1ng CameraX."',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit("Expected exactly one settings label: " + old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Apply liquid-glass watermark and smooth blur
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["PROJECT_DIR"])

          wp = root / "smali_classes3/com/xcam/offline/WatermarkProcessor.smali"
          ws = wp.read_text()
          a = ws.index(".method private final drawSoftBackdrop(")
          b = ws.index(".end method", a)
          wb = ws[a:b]
          if wb.count("div-int/lit8 v0, v0, 0x1c") != 1 or wb.count("div-int/lit8 v3, v3, 0x1c") != 1 or wb.count("const/16 v1, 0x50") != 1:
              raise SystemExit("Unexpected soft-blur implementation; refusing unsafe patch")
          wb = wb.replace("div-int/lit8 v0, v0, 0x1c", "div-int/lit8 v0, v0, 0x8", 1)
          wb = wb.replace("div-int/lit8 v3, v3, 0x1c", "div-int/lit8 v3, v3, 0x8", 1)
          wb = wb.replace("const/16 v1, 0x50", "const/16 v1, 0x200", 1)
          wp.write_text(ws[:a] + wb + ws[b:])

          mp = root / "smali_classes7/com/xcam/offline/WatermarkStyleFeature.smali"
          ms = mp.read_text()
          if ms.count('"Watermark Style"') != 1 or ms.count('"FujiFilm 01"') != 1:
              raise SystemExit("Watermark style labels not found uniquely")
          ms = ms.replace('"Watermark Style"', '"KIỂU WATERMARK"', 1)
          ms = ms.replace('"FujiFilm 01"', '"KÍNH LỎNG · FUJIFILM"', 1)
          a = ms.index(".method private static renderShowcase(")
          b = ms.index(".end method", a)
          mb = ms[a:b]
          gap = chr(10) * 2
          fill = "    const/4 v5, -0x1" + gap + "    invoke-virtual {v3, v5}, Landroid/graphics/Paint;->setColor(I)V"
          glass = gap.join(["    const/16 v5, 0xdc", "    const/16 v6, 0x12", "    const/16 v8, 0x18", "    const/16 v9, 0x20", "    invoke-static {v5, v6, v8, v9}, Landroid/graphics/Color;->argb(IIII)I", "    move-result v5", "    invoke-virtual {v3, v5}, Landroid/graphics/Paint;->setColor(I)V"])
          if mb.count(fill) != 1:
              raise SystemExit("Could not locate watermark glass panel fill")
          mb = mb.replace(fill, glass, 1)
          edge = "    const/16 v9, 0xe1" + gap + "    invoke-static {v9, v9, v9}, Landroid/graphics/Color;->rgb(III)I"
          reflective_edge = gap.join(["    const/16 v9, 0x9c", "    const/16 v11, 0xd8", "    const/16 v14, 0xf0", "    invoke-static {v9, v11, v14}, Landroid/graphics/Color;->rgb(III)I"])
          if mb.count(edge) != 1:
              raise SystemExit("Could not locate watermark reflective edge")
          mb = mb.replace(edge, reflective_edge, 1)
          mb = mb.replace('"sans-serif-condensed"', '"sans-serif"', 1)
          dark_text = "    const/16 v9, 0x14" + gap + "    invoke-static {v9, v9, v9}, Landroid/graphics/Color;->rgb(III)I" + chr(10) * 2 + "    move-result v11"
          light_text = "    const/4 v9, -0x1" + gap + "    move v11, v9"
          if mb.count(dark_text) != 1:
              raise SystemExit("Could not locate watermark text color")
          mb = mb.replace(dark_text, light_text, 1)
          ms = ms[:a] + mb + ms[b:]
          mp.write_text(ms)
          print("Liquid-glass watermark and smooth non-pixel blur patches applied.")
          PY
      - name: Add tactile shutter feedback
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes3/com/xcam/offline/MainActivity.smali"
          s = p.read_text()
          nl = chr(10)
          anchor = ".method private final playShutter()V" + nl + "    .locals 4" + nl
          injected = "    iget-object v0, p0, Lcom/xcam/offline/MainActivity;->shutterEffect:Lcom/xcam/offline/MainActivity$ShutterEffectView;" + nl + "    if-eqz v0, :haptic_done" + nl + "    const/4 v1, 0x1" + nl + "    invoke-virtual {v0, v1}, Landroid/view/View;->performHapticFeedback(I)Z" + nl + "    :haptic_done" + nl
          if s.count(anchor) != 1:
              raise SystemExit("Could not safely locate playShutter()")
          p.write_text(s.replace(anchor, anchor + injected, 1))
          PY
      - name: Apply Camera2 Pro controls
        run: |
          set -e
          # Keep the new controller in a dedicated dex shard. This avoids the
          # source/dex shard collision that left only unresolved class references.
          PRO_DIR="$PROJECT_DIR/smali_classes11/com/xcam/offline"
          mkdir -p "$PRO_DIR"
          cp patches/ProCameraFeature.smali "$PRO_DIR/ProCameraFeature.smali"
          cp 'patches/ProCameraFeature$ChoiceClick.smali' "$PRO_DIR/ProCameraFeature$ChoiceClick.smali"
          cp 'patches/ProCameraFeature$MenuClick.smali' "$PRO_DIR/ProCameraFeature$MenuClick.smali"
          cp 'patches/ProCameraFeature$OpenClick.smali' "$PRO_DIR/ProCameraFeature$OpenClick.smali"
          test "$(find "$PRO_DIR" -maxdepth 1 -name 'ProCameraFeature*.smali' | wc -l)" -eq 4
          python3 patches/install_pro_controller.py
      - name: Build unsigned APK
        run: |
          set -e
          mkdir -p output
          java -Xmx4g -jar apktool.jar b "$PROJECT_DIR" -o output/Fujifilm-Mode-unsigned.apk
          # Decode the produced APK and verify that all Pro class definitions
          # are actually packaged, not merely referenced by MainActivity.
          java -jar apktool.jar d -f output/Fujifilm-Mode-unsigned.apk -o output/verify-apk
          VERIFY_DIR=$(find output/verify-apk -type f -name 'ProCameraFeature.smali' -print -quit)
          test -n "$VERIFY_DIR"
          for cls in 'ProCameraFeature$ChoiceClick' 'ProCameraFeature$MenuClick' 'ProCameraFeature$OpenClick'; do
            test -f "$(dirname "$VERIFY_DIR")/$cls.smali"
          done
          echo "Verified all four ProCameraFeature class definitions inside built APK."
      - name: Download APK signer
        run: curl -L --fail -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore release.jks -storepass temporary123 -keypass temporary123 -alias release -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Fujifilm Mode, O=Build, C=VN"
      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar -a output/Fujifilm-Mode-unsigned.apk -o output/signed --ks release.jks --ksAlias release --ksPass temporary123 --ksKeyPass temporary123
      - name: Prepare APK
        run: |
          APK=$(find output/signed -type f -name '*signed.apk' -print -quit)
          test -n "$APK"
          cp "$APK" output/Fujifilm-Mode-app-debug.apk
          sha256sum output/Fujifilm-Mode-app-debug.apk > output/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fujifilm-Mode-app-debug
          path: |
            output/Fujifilm-Mode-app-debug.apk
            output/SHA256SUMS.txt
            
