name: FujiFilm Mode 2.7.0 Debug validation
# Build APK and publish it even if the hosted Android Emulator cannot complete.

on:
  push:
    branches: [main, "feature/fujifilm-mode-1.6", "feature/lunadream-2.5.0dream", "fuji-2.5.0-round1-spec", "fuji-2.5.0-round1-stage", "fuji-2.5.0-full-work", "fuji-2.5.0-prompt-2026-11-22-round1", "fuji-2.7.0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landscape-ui-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 platform 37.0
        run: |
          yes | sdkmanager --licenses --channel=3 >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests and build an internal emulator APK
        working-directory: CamUI-src
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload installable APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fujifilm-mode-2.7.0-debug-apk
          path: |
            CamUI-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Update Android command-line tools for API 37 preview emulator
        run: |
          yes | sdkmanager --licenses --channel=3 >/dev/null
          sdkmanager --install "cmdline-tools;latest" --channel=3
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Cold-start smoke test on Android 17 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          # Use a stable Android 15 Google APIs image; the Android 17 Preview
          # image booted but its Settings/ADB service disconnected before tests.
          api-level: "35"
          target: google_apis
          channel: stable
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 600
          script: |
            script: bash .github/scripts/camui-emulator-smoke-test.sh

      - name: Upload emulator inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-inspection
          path: emulator-artifacts/
          if-no-files-found: warn

