name: FujiFilm Mode 2.9.2 Debug APK

on:
  push:
    branches:
      - fuji-2.9.1-g1
      - fuji-2.9.1-g2
      - fuji-2.9.2-g3
  workflow_dispatch:

concurrency:
  group: fuji-2.9.2-g3-debug
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 platform 37.0
        run: |
          yes | sdkmanager --licenses --channel=3 >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Kiểm tra điểm ghi JPEG cuối
        run: |
          python3 .github/scripts/check-jpeg-writes.py

      - name: Build Debug APK
        working-directory: CamUI-src
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Calculate APK SHA-256
        run: |
          sha256sum CamUI-src/app/build/outputs/apk/debug/app-debug.apk | tee CamUI-src/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: FujiFilm-Mode-2.9.2-G3-Debug
          path: |
            CamUI-src/app/build/outputs/apk/debug/app-debug.apk
            CamUI-src/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
