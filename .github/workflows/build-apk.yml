
name: Build Fujifilm Mode APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Apktool
        run: curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
      - name: Extract app project
        run: |
          mkdir -p decoded-project
          unzip -q app.zip -d decoded-project
          PROJECT_DIR=$(find decoded-project -type f -name apktool.yml -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/AndroidManifest.xml" ]; then
            echo "ERROR: Không tìm thấy dự án Apktool hợp lệ trong app.zip"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Camera2 ID and physical camera scanner
        run: |
          set -e
          mkdir -p "$PROJECT_DIR/smali_classes3/com/xcam/offline"
          cp patches/CameraIdScanner.smali "$PROJECT_DIR/smali_classes3/com/xcam/offline/CameraIdScanner.smali"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["PROJECT_DIR"])
          listeners = list(root.rglob("CameraInfoDialog$1.smali"))
          dialogs = list(root.rglob("CameraInfoDialog.smali"))
          if len(listeners) != 1 or len(dialogs) != 1:
              raise SystemExit("Expected one CameraInfoDialog listener and class")
          lp = listeners[0]
          ls = lp.read_text()
          old = "Lcom/xcam/offline/CameraInfoDialog;->show(Landroid/content/Context;)V"
          new = "Lcom/xcam/offline/CameraIdScanner;->show(Landroid/content/Context;)V"
          if ls.count(old) != 1:
              raise SystemExit("Could not safely locate camera info button action")
          lp.write_text(ls.replace(old, new, 1))
          dp = dialogs[0]
          ds = dp.read_text()
          old_label = '"Th\\u00f4ng s\\u1ed1 camera"'
          if ds.count(old_label) != 2:
              raise SystemExit("Expected the camera info button and dialog title labels")
          dp.write_text(ds.replace(old_label, '"CAMERA ID SCANNER"'))
          PY
      - name: Set testing app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['PROJECT_DIR']) / 'AndroidManifest.xml'
          s = p.read_text()
          a = s.index('<application')
          b = s.index('>', a)
          tag = s[a:b]
          import re
          tag, n = re.subn(r'android:label="[^"]*"', 'android:label="Fujifilm Mode (app-debug)"', tag, count=1)
          if n == 0:
              tag += ' android:label="Fujifilm Mode (app-debug)"'
          p.write_text(s[:a] + tag + s[b:])
          PY
      - name: Apply Fuji-inspired interface patch
        run: |
          set -e
          mkdir -p "$PROJECT_DIR/smali_classes3/com/xcam/offline"
          cp patches/FujiDesignFeature.smali "$PROJECT_DIR/smali_classes3/com/xcam/offline/FujiDesignFeature.smali"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes3/com/xcam/offline/MainActivity.smali"
          s = p.read_text()
          anchor = "    invoke-static {v6}, Lcom/xcam/offline/UiV111Feature;->install(Landroid/app/Activity;)V"
          patch = anchor + "\n    invoke-static {v6}, Lcom/xcam/offline/FujiDesignFeature;->install(Landroid/app/Activity;)V"
          if s.count(anchor) != 1:
              raise SystemExit("Could not safely locate the single UI installation point")
          p.write_text(s.replace(anchor, patch, 1))
          PY
      - name: Add hardware noise reduction OFF mode
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes3/com/xcam/offline/MainActivity.smali"
          s = p.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one safe match, found {count}")
              return source.replace(old, new, 1)

          # Preserve the existing default, but allow the persisted setting to be index 2.
          a = s.index(".method private final loadSettings()V")
          b = s.index(".end method", a)
          block = s[a:b]
          old = """              move-result v3

              invoke-static {v3, v1, v4}, Lkotlin/ranges/RangesKt;->coerceIn(III)I"""
          new = """              move-result v3

              const/4 v5, 0x2

              invoke-static {v3, v1, v5}, Lkotlin/ranges/RangesKt;->coerceIn(III)I"""
          block = replace_once(block, old, new, "loadSettings denoise range")
          s = s[:a] + block + s[b:]

          # Add a third RadioButton in the existing Khử nhiễu ảnh group.
          a = s.index(".method private final showSettings()V")
          b = s.index(".end method", a)
          block = s[a:b]
          old = """              const/4 v6, 0x2

              new-array v0, v6, [Ljava/lang/String;

              const-string v1, "Nh\\u1eb9"

              aput-object v1, v0, v13

              const-string v1, "Best"

              const/4 v2, 0x1

              aput-object v1, v0, v2"""
          new = """              const/4 v6, 0x3

              new-array v0, v6, [Ljava/lang/String;

              const-string v1, "Nh\\u1eb9"

              aput-object v1, v0, v13

              const-string v1, "Best"

              const/4 v2, 0x1

              aput-object v1, v0, v2

              const-string v1, "T\\u1eaft"

              const/4 v2, 0x2

              aput-object v1, v0, v2"""
          block = replace_once(block, old, new, "denoise option labels")
          s = s[:a] + block + s[b:]

          # Map UI index 2 to Camera2 NOISE_REDUCTION_MODE_OFF (0).
          a = s.index(".method private final resolveNoiseReductionMode(")
          b = s.index(".end method", a)
          block = s[a:b]
          old = """              if-ne v2, v4, :cond_1

              move v2, v3

              goto :goto_0

              :cond_1

              move v2, v4"""
          new = """              if-nez v2, :cond_denoise_nonzero

              move v2, v4

              goto :goto_0

              :cond_denoise_nonzero

              if-ne v2, v4, :cond_denoise_off

              move v2, v3

              goto :goto_0

              :cond_denoise_off

              const/4 v2, 0x0"""
          block = replace_once(block, old, new, "Camera2 noise reduction mapping")

          # If Camera2 reports OFF as unsupported, do not silently select FAST/MINIMAL.
          old = """              :cond_2

              const/4 v5, 0x3"""
          new = """              :cond_2

              iget v2, p0, Lcom/xcam/offline/MainActivity;->denoiseMode:I

              const/4 v3, 0x2

              if-ne v2, v3, :continue_denoise_fallback

              return-object v0

              :continue_denoise_fallback

              const/4 v5, 0x3"""
          block = replace_once(block, old, new, "OFF unsupported fallback guard")
          s = s[:a] + block + s[b:]

          p.write_text(s)
          print("Added OFF option; saved mode range is 0..2 and Camera2 OFF maps to value 0.")
          PY
      - name: Localize camera settings and clarify output formats
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes3/com/xcam/offline/MainActivity.smali"
          s = p.read_text()
          replacements = {
              '"WATERMARK & FRAME"': '"WATERMARK & KHUNG ANH"',
              '"L\\u01b0u th\\u00eam PNG ch\\u01b0a \\u00e1p m\\u00e0u phim (kh\\u00f4ng ph\\u1ea3i RAW)"': '"L\\u01b0u th\\u00eam PNG g\\u1ed1c (kh\\u00f4ng ph\\u1ea3i RAW/DNG)"',
              '"\\u0110I\\u1ec0U KHI\\u1ec2N"': '"\\u0110I\\u1ec0U KHI\\u1ec2N CAMERA"',
              '"RAW/DNG: ch\\u01b0a \\u0111\\u01b0\\u1ee3c h\\u1ed7 tr\\u1ee3 trong pipeline CameraX n\\u00e0y"': '"RAW/DNG ch\\u01b0a \\u0111\\u01b0\\u1ee3c h\\u1ed7 tr\\u1ee3: hi\\u1ec7n t\\u1ea1i app ch\\u1ee5p JPEG b\\u1eb1ng CameraX."',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit("Expected exactly one settings label: " + old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Polish watermark settings labels
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes7/com/xcam/offline/WatermarkStyleFeature.smali"
          s = p.read_text()
          start = s.index(".method public static addControls(Landroid/widget/LinearLayout;Landroid/app/Activity;)V")
          end = s.index(".end method", start)
          block = s[start:end]
          if "    .locals 9" not in block:
              raise SystemExit("Unexpected addControls register layout; refusing unsafe patch")
          block = block.replace("    .locals 9", "    .locals 10", 1)
          if block.count('"Watermark Style"') != 1 or block.count('"FujiFilm 01"') != 1:
              raise SystemExit("Watermark labels were not found exactly once")
          block = block.replace('"Watermark Style"', '"KIỂU WATERMARK"', 1)
          block = block.replace('"FujiFilm 01"', '"FUJIFILM SIGNATURE"', 1)
          nl = chr(10)
          anchor = "    invoke-virtual {v4, v5}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;)V" + nl + nl + "    .line 49"
          subtitle = nl.join([
              "    new-instance v9, Landroid/widget/TextView;",
              "    invoke-direct {v9, p1}, Landroid/widget/TextView;-><init>(Landroid/content/Context;)V",
              '    const-string v6, "Chọn kiểu hiển thị watermark được in lên ảnh."',
              "    invoke-virtual {v9, v6}, Landroid/widget/TextView;->setText(Ljava/lang/CharSequence;)V",
              "    const/high16 v6, 0x41300000    # 11.0f",
              "    invoke-virtual {v9, v6}, Landroid/widget/TextView;->setTextSize(F)V",
              "    const v6, -0x777778",
              "    invoke-virtual {v9, v6}, Landroid/widget/TextView;->setTextColor(I)V",
              "    invoke-virtual {v4, v9}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;)V",
              "",
              "    .line 49"
          ])
          if block.count(anchor) != 1:
              raise SystemExit("Could not safely locate watermark title insertion point")
          block = block.replace(anchor, "    invoke-virtual {v4, v5}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;)V" + nl + subtitle, 1)
          p.write_text(s[:start] + block + s[end:])
          PY
      - name: Add tactile shutter feedback
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes3/com/xcam/offline/MainActivity.smali"
          s = p.read_text()
          nl = chr(10)
          anchor = ".method private final playShutter()V" + nl + "    .locals 4" + nl
          injected = "    iget-object v0, p0, Lcom/xcam/offline/MainActivity;->shutterEffect:Lcom/xcam/offline/MainActivity$ShutterEffectView;" + nl + "    if-eqz v0, :haptic_done" + nl + "    const/4 v1, 0x1" + nl + "    invoke-virtual {v0, v1}, Landroid/view/View;->performHapticFeedback(I)Z" + nl + "    :haptic_done" + nl
          if s.count(anchor) != 1:
              raise SystemExit("Could not safely locate playShutter()")
          p.write_text(s.replace(anchor, anchor + injected, 1))
          PY
      - name: Build unsigned APK
        run: |
          mkdir -p output
          java -Xmx4g -jar apktool.jar b "$PROJECT_DIR" -o output/Fujifilm-Mode-unsigned.apk
      - name: Download APK signer
        run: curl -L --fail -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore release.jks -storepass temporary123 -keypass temporary123 -alias release -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Fujifilm Mode, O=Build, C=VN"
      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar -a output/Fujifilm-Mode-unsigned.apk -o output/signed --ks release.jks --ksAlias release --ksPass temporary123 --ksKeyPass temporary123
      - name: Prepare APK
        run: |
          APK=$(find output/signed -type f -name '*signed.apk' -print -quit)
          test -n "$APK"
          cp "$APK" output/Fujifilm-Mode-app-debug.apk
          sha256sum output/Fujifilm-Mode-app-debug.apk > output/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fujifilm-Mode-app-debug
          path: |
            output/Fujifilm-Mode-app-debug.apk
            output/SHA256SUMS.txt
            
