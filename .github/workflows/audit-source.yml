name: Audit Fujifilm app source
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.zip'
      - '.github/workflows/audit-source.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract decoded APK project
        run: |
          mkdir -p decoded
          unzip -q app.zip -d decoded
          PROJECT_DIR=$(find decoded -type f -name apktool.yml -print -quit | xargs dirname)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Inspect activity startup and layout hierarchy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ["PROJECT_DIR"])/"smali_classes3/com/xcam/offline/MainActivity.smali"
          lines=p.read_text(errors="ignore").splitlines()
          def dump_method(name):
              st=next(i for i,x in enumerate(lines) if x.startswith(".method ") and name in x)
              en=next(i for i in range(st+1,len(lines)) if lines[i]==".end method")
              print(f"=== METHOD {name} lines {st+1}-{en+1} ===")
              for n in range(st,en+1): print(f"{n+1}: {lines[n]}")
          dump_method("onCreate(Landroid/os/Bundle;)V")
          dump_method("buildUi()V")
          PY
