name: Build CamerAwesome UI experiment (debug APK)

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Fujifilm camera source
        run: |
          set -e
          test -d CamUI-src
          cp -R CamUI-src CamUI
          echo "Camera source files:"
          find CamUI -maxdepth 8 -type f | sort

      - name: Export extracted CamUI source for repair
        uses: actions/upload-artifact@v4
        with:
          name: CamUI-source-for-repair
          path: CamUI/**
          include-hidden-files: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb" || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Set up Python for deterministic NAFNet ONNX export
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Export and smoke-test NAFNet primary and fallback models
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1+cpu" "torchvision==0.20.1+cpu"
          python -m pip install \
            "numpy==1.26.4" \
            "opencv-python-headless==4.10.0.84" \
            "pillow==11.0.0" \
            "onnx==1.17.0" \
            "onnxruntime==1.20.1"

          git clone --depth 1 https://github.com/mikecokina/nafnetlib.git "$RUNNER_TEMP/nafnetlib"
          MODEL_DIR="$RUNNER_TEMP/nafnet-model-weights"
          OUTPUT_DIR="$GITHUB_WORKSPACE/CamUI/app/src/main/assets/models"
          mkdir -p "$MODEL_DIR" "$OUTPUT_DIR"
          python scripts/export_nafnet_onnx.py \
            --nafnetlib-src "$RUNNER_TEMP/nafnetlib/src" \
            --model-dir "$MODEL_DIR" \
            --output-dir "$OUTPUT_DIR"

          test -s "$OUTPUT_DIR/nafnet_sidd_width64.onnx"
          test -s "$OUTPUT_DIR/nafnetlib_sidd_width32.onnx"
          test -s "$OUTPUT_DIR/manifest.sha256"
          (cd "$OUTPUT_DIR" && sha256sum -c manifest.sha256)
          echo "Verified bundled NAFNet ONNX assets:"
          ls -lh "$OUTPUT_DIR"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: CamUI
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fujifilm-CamerAwesome-HDMP-AI-debug
          path: CamUI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
