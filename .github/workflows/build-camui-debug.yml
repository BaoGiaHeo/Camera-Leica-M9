name: Build FujiFilm Mode CamUI Debug APK

on:
  push:
    branches:
      - feature/fujifilm-mode-1.6
    paths:
      - "CamUI-src/**"
      - ".github/workflows/build-camui-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        working-directory: CamUI-src
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: CamUI-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
