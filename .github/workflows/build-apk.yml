
name: Build Fujifilm Mode APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Apktool
        run: curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
      - name: Extract app project
        run: |
          mkdir -p decoded-project
          unzip -q app.zip -d decoded-project
          PROJECT_DIR=$(find decoded-project -type f -name apktool.yml -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/AndroidManifest.xml" ]; then
            echo "ERROR: Không tìm thấy dự án Apktool hợp lệ trong app.zip"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply Fuji-inspired interface patch
        run: |
          set -e
          mkdir -p "$PROJECT_DIR/smali_classes3/com/xcam/offline"
          cp patches/FujiDesignFeature.smali "$PROJECT_DIR/smali_classes3/com/xcam/offline/FujiDesignFeature.smali"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes3/com/xcam/offline/MainActivity.smali"
          s = p.read_text()
          anchor = "    invoke-static {v6}, Lcom/xcam/offline/UiV111Feature;->install(Landroid/app/Activity;)V"
          patch = anchor + "\n    invoke-static {v6}, Lcom/xcam/offline/FujiDesignFeature;->install(Landroid/app/Activity;)V"
          if s.count(anchor) != 1:
              raise SystemExit("Could not safely locate the single UI installation point")
          p.write_text(s.replace(anchor, patch, 1))
          PY
      - name: Polish watermark settings labels
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes7/com/xcam/offline/WatermarkStyleFeature.smali"
          s = p.read_text()
          start = s.index(".method public static addControls(Landroid/widget/LinearLayout;Landroid/app/Activity;)V")
          end = s.index(".end method", start)
          block = s[start:end]
          if "    .locals 9" not in block:
              raise SystemExit("Unexpected addControls register layout; refusing unsafe patch")
          block = block.replace("    .locals 9", "    .locals 10", 1)
          if block.count('"Watermark Style"') != 1 or block.count('"FujiFilm 01"') != 1:
              raise SystemExit("Watermark labels were not found exactly once")
          block = block.replace('"Watermark Style"', '"KIỂU WATERMARK"', 1)
          block = block.replace('"FujiFilm 01"', '"FUJIFILM SIGNATURE"', 1)
          nl = chr(10)
          anchor = "    invoke-virtual {v4, v5}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;)V" + nl + nl + "    .line 49"
          subtitle = nl.join([
              "    new-instance v9, Landroid/widget/TextView;",
              "    invoke-direct {v9, p1}, Landroid/widget/TextView;-><init>(Landroid/content/Context;)V",
              '    const-string v6, "Chọn kiểu hiển thị watermark được in lên ảnh."',
              "    invoke-virtual {v9, v6}, Landroid/widget/TextView;->setText(Ljava/lang/CharSequence;)V",
              "    const/high16 v6, 0x41300000    # 11.0f",
              "    invoke-virtual {v9, v6}, Landroid/widget/TextView;->setTextSize(F)V",
              "    const v6, -0x777778",
              "    invoke-virtual {v9, v6}, Landroid/widget/TextView;->setTextColor(I)V",
              "    invoke-virtual {v4, v9}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;)V",
              "",
              "    .line 49"
          ])
          if block.count(anchor) != 1:
              raise SystemExit("Could not safely locate watermark title insertion point")
          block = block.replace(anchor, "    invoke-virtual {v4, v5}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;)V" + nl + subtitle, 1)
          p.write_text(s[:start] + block + s[end:])
          PY
      - name: Add tactile shutter feedback
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "smali_classes3/com/xcam/offline/MainActivity.smali"
          s = p.read_text()
          nl = chr(10)
          anchor = ".method private final playShutter()V" + nl + "    .locals 4" + nl
          injected = "    iget-object v0, p0, Lcom/xcam/offline/MainActivity;->shutterEffect:Lcom/xcam/offline/MainActivity$ShutterEffectView;" + nl + "    if-eqz v0, :haptic_done" + nl + "    const/4 v1, 0x1" + nl + "    invoke-virtual {v0, v1}, Landroid/view/View;->performHapticFeedback(I)Z" + nl + "    :haptic_done" + nl
          if s.count(anchor) != 1:
              raise SystemExit("Could not safely locate playShutter()")
          p.write_text(s.replace(anchor, anchor + injected, 1))
          PY
      - name: Build unsigned APK
        run: |
          mkdir -p output
          java -Xmx4g -jar apktool.jar b "$PROJECT_DIR" -o output/Fujifilm-Mode-unsigned.apk
      - name: Download APK signer
        run: curl -L --fail -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore release.jks -storepass temporary123 -keypass temporary123 -alias release -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Fujifilm Mode, O=Build, C=VN"
      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar -a output/Fujifilm-Mode-unsigned.apk -o output/signed --ks release.jks --ksAlias release --ksPass temporary123 --ksKeyPass temporary123
      - name: Prepare APK
        run: |
          APK=$(find output/signed -type f -name '*signed.apk' -print -quit)
          test -n "$APK"
          cp "$APK" output/Fujifilm-Mode-release.apk
          sha256sum output/Fujifilm-Mode-release.apk > output/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fujifilm-Mode-release
          path: |
            output/Fujifilm-Mode-release.apk
            output/SHA256SUMS.txt
            
