name: Build FujiFilm Mode 1.6 FULL HDMP AI debug APK

'on':
  push:
    branches: [main, "feature/fujifilm-mode-1.6"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Fujifilm camera source
        run: |
          set -e
          test -d CamUI-src
          cp -R CamUI-src CamUI
          echo "Camera source files:"
          find CamUI -maxdepth 8 -type f | sort

      - name: Export extracted CamUI source for repair
        uses: actions/upload-artifact@v4
        with:
          name: CamUI-source-for-repair
          path: CamUI/**
          include-hidden-files: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb" || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Set up Python for deterministic NAFNet ONNX export
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/build-camui.yml

      - name: Export and smoke-test NAFNet primary and fallback models
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1+cpu" "torchvision==0.20.1+cpu"
          python -m pip install \
            "numpy==1.26.4" \
            "opencv-python-headless==4.10.0.84" \
            "pillow==11.0.0" \
            "onnx==1.17.0" \
            "onnxruntime==1.20.1"

          # Pin both upstream sources so the exported model provenance is reproducible.
          git clone https://github.com/megvii-research/NAFNet.git "$RUNNER_TEMP/NAFNet"
          git -C "$RUNNER_TEMP/NAFNet" checkout 2b4af71ebe098a92a75910c233a3965a3e93ede4
          git clone https://github.com/mikecokina/nafnetlib.git "$RUNNER_TEMP/nafnetlib"
          git -C "$RUNNER_TEMP/nafnetlib" checkout 0ee63e3f6577a4c2475221f4c8a3cf0fcf4ac52d

          MODEL_DIR="$RUNNER_TEMP/nafnet-model-weights"
          OUTPUT_DIR="$GITHUB_WORKSPACE/CamUI/app/src/main/assets/models"
          mkdir -p "$MODEL_DIR" "$OUTPUT_DIR"
          MODEL="$MODEL_DIR/NAFNet-SIDD-width64.pth"
          MODEL_URL="https://huggingface.co/mikestealth/nafnet-models/resolve/main/NAFNet-SIDD-width64.pth"
          EXPECTED_SHA256="cd685efaae01f7c4e9951f2deab05780079c8eb1e49ed664b72f6db04dabb445"
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 "$MODEL_URL" -o "$MODEL"
          echo "$EXPECTED_SHA256  $MODEL" | sha256sum --check -
          test -s "$MODEL"
          echo "Verified official Megvii NAFNet-SIDD-width64 checkpoint: $(stat -c '%s' "$MODEL") bytes"
          python scripts/export_nafnet_onnx.py \
            --official-nafnet-src "$RUNNER_TEMP/NAFNet" \
            --official-width64-checkpoint "$MODEL_DIR/NAFNet-SIDD-width64.pth" \
            --nafnetlib-src "$RUNNER_TEMP/nafnetlib" \
            --model-dir "$MODEL_DIR" \
            --output-dir "$OUTPUT_DIR"

          test -s "$OUTPUT_DIR/nafnet_sidd_width64.onnx"
          test -s "$OUTPUT_DIR/nafnetlib_sidd_width32.onnx"
          test -s "$OUTPUT_DIR/manifest.sha256"
          (cd "$OUTPUT_DIR" && sha256sum -c manifest.sha256)
          echo "Verified bundled NAFNet ONNX assets:"
          ls -lh "$OUTPUT_DIR"

      - name: Prepare standalone HDMP AI test app with production models
        run: |
          set -euo pipefail
          mkdir -p CamUI/hdmp-test/src/main/assets/models
          cp CamUI/app/src/main/assets/models/nafnet_sidd_width64.onnx CamUI/hdmp-test/src/main/assets/models/
          cp CamUI/app/src/main/assets/models/nafnetlib_sidd_width32.onnx CamUI/hdmp-test/src/main/assets/models/
          cp CamUI/app/src/main/assets/models/manifest.sha256 CamUI/hdmp-test/src/main/assets/models/
          test -s CamUI/hdmp-test/src/main/assets/models/nafnet_sidd_width64.onnx
          test -s CamUI/hdmp-test/src/main/assets/models/nafnetlib_sidd_width32.onnx

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: CamUI
        run: gradle testDebugUnitTest assembleDebug :hdmp-test:assembleDebug --stacktrace

      - name: Verify APK contains both hash-pinned HDMP AI models
        working-directory: CamUI
        run: |
          python - <<'PY'
          import glob
          import zipfile

          apks = glob.glob("app/build/outputs/apk/debug/*.apk")
          assert apks, "Debug APK was not produced"
          required = {
              "assets/models/nafnet_sidd_width64.onnx",
              "assets/models/nafnetlib_sidd_width32.onnx",
              "assets/models/manifest.sha256",
          }
          with zipfile.ZipFile(apks[0]) as apk:
              names = set(apk.namelist())
              missing = sorted(required - names)
              assert not missing, f"APK missing HDMP AI assets: {missing}"
              for name in sorted(required):
                  info = apk.getinfo(name)
                  assert info.file_size > 0, f"Empty APK asset: {name}"
                  print(f"{name}: {info.file_size:,} bytes")
          PY
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Fujifilm-Mode-1.6-and-HDMP-AI-Test-debug
          path: |
            CamUI/app/build/outputs/apk/debug/app-debug.apk
            CamUI/app/build/outputs/apk/debug/SHA256SUMS.txt
            CamUI/hdmp-test/build/outputs/apk/debug/hdmp-test-debug.apk
          if-no-files-found: error
