name: FujiFilm Mode 2.5.0 developer APK

on:
  push:
    branches: ["fuji-2.5.0-prompt-2026-11-22-apk"]

permissions:
  contents: read

concurrency:
  group: fujifilm-developer-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-developer-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 37 platform and build tools
        run: |
          yes | sdkmanager --licenses --channel=3 >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Assemble installable developer APK
        working-directory: CamUI-src
        run: gradle :app:assembleDeveloper --stacktrace --console=plain

      - name: Upload developer APK
        uses: actions/upload-artifact@v4
        with:
          name: fujifilm-mode-2.5.0-developer-apk
          path: CamUI-src/app/build/outputs/apk/developer/app-developer.apk
          if-no-files-found: error
          retention-days: 14
