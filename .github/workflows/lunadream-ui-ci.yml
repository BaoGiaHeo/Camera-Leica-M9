name: LunaDream UI compile and test
# Rebuild current branch source after the requested camera fixes.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lunadream-2.5.0dream
      - fix/2.5.0dream-af-label

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify legacy colour controls are absent
        run: |
          legacy_compact="$(printf '%s%s' 'tone' 'pad')"
          legacy_snake="$(printf '%s%s' 'tone' '_pad')"
          legacy_spaced="$(printf '%s %s' 'tone' 'pad')"
          legacy_dashed="$(printf '%s-%s' 'tone' 'pad')"
          pattern="${legacy_compact}|${legacy_snake}|${legacy_spaced}|${legacy_dashed}"
          if git grep -niE "$pattern" -- . ':!CamUI-src/app/src/main/java/com/example/camui/LegacyColorAdjustmentCleanup.kt' ':!.github/workflows/lunadream-ui-ci.yml'; then
            echo "Obsolete colour-panel references remain in the repository."
            exit 1
          fi
      - name: Compile and run unit tests
        run: gradle -p CamUI-src :app:testDeveloperUnitTest :app:assembleDeveloper --stacktrace

      - name: Run KK7 glyph and Android font rendering tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          profile: pixel_2
          arch: x86_64
          disable-linux-hw-accel: true
          disable-animations: true
          emulator-boot-timeout: 900
          script: gradle -p CamUI-src :app:connectedDeveloperAndroidTest --stacktrace
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'

      - name: Upload Developer test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FujiFilm-Mode-2.5.0Dream-Developer
          path: CamUI-src/app/build/outputs/apk/developer/app-developer.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package complete modified Kotlin source files
        if: always() && !cancelled()
        run: |
          mkdir -p source-artifacts
          zip -q source-artifacts/LunaDream-2.5.0dream-source-files.zip \
            .github/workflows/build-lunadream-variants.yml \
            .github/workflows/lunadream-ui-ci.yml \
            CamUI-src/app/build.gradle.kts \
            CamUI-src/app/src/androidTest/java/com/example/camui/FujiTypographyGlyphCoverageTest.kt \
            CamUI-src/app/src/main/assets/fonts/KK7-LICENSE-REVIEW.txt \
            CamUI-src/app/src/main/assets/fonts/ShareTechMono-NOTICE.txt \
            CamUI-src/app/src/main/assets/fonts/ShareTechMono-OFL.txt \
            CamUI-src/app/src/main/assets/fonts/vcr_osd_mono_kk7.ttf.gz \
            CamUI-src/app/src/main/java/com/example/camui/AnimaT.kt \
            CamUI-src/app/src/main/java/com/example/camui/BackupSettings.kt \
            CamUI-src/app/src/main/java/com/example/camui/CameraAfAreaSize.kt \
            CamUI-src/app/src/main/java/com/example/camui/CameraScreen.kt \
            CamUI-src/app/src/main/java/com/example/camui/CameraFrameMetricsDiagnostics.kt \
            CamUI-src/app/src/main/java/com/example/camui/CameraControlProgress.kt \
            CamUI-src/app/src/main/java/com/example/camui/Camera2Info.kt \
            CamUI-src/app/src/main/java/com/example/camui/CameraLcdDisplayMode.kt \
            CamUI-src/app/src/main/java/com/example/camui/CameraLookCatalog.kt \
            CamUI-src/app/src/main/java/com/example/camui/PixelOsdGeometry.kt \
            CamUI-src/app/src/main/java/com/example/camui/Components.kt \
            CamUI-src/app/src/main/java/com/example/camui/FaceTrackSmoother.kt \
            CamUI-src/app/src/main/java/com/example/camui/FujiSkin.kt \
            CamUI-src/app/src/main/java/com/example/camui/FujiTypography.kt \
            CamUI-src/app/src/main/java/com/example/camui/LegacyColorAdjustmentCleanup.kt \
            CamUI-src/app/src/main/java/com/example/camui/MainActivity.kt \
            CamUI-src/app/src/main/java/com/example/camui/PixelOsdInvalidation.kt \
            CamUI-src/app/src/main/java/com/example/camui/ZoomCapabilityPolicy.kt \
            CamUI-src/app/src/main/java/com/example/camui/PixelOsdLayer.kt \
            CamUI-src/app/src/main/java/com/example/camui/QuickSettings.kt \
            CamUI-src/app/src/main/java/com/example/camui/SettingsScreen.kt \
            CamUI-src/app/src/main/java/com/example/camui/UtilityScreens.kt \
            CamUI-src/app/src/main/res/font/share_tech_mono.ttf \
            CamUI-src/app/src/main/res/values/strings.xml \
            CamUI-src/app/src/main/res/values-vi/strings.xml \
            CamUI-src/app/src/main/res/values/themes.xml \
            CamUI-src/app/src/test/java/com/example/camui/CameraAfLabelContractTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/CameraAfAreaSizeTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/CameraLcdDisplayModeTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/CameraLookCatalogTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/CameraFrameMetricsDiagnosticsTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/CameraControlProgressTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/ZoomCapabilityPolicyTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/FaceTrackSmootherTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/FujiKeyHoldPolicyTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/FujiTypographyAssetTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/LegacyColorAdjustmentCleanupTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/LocalizationResourceParityTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/PixelOsdInvalidationTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/PixelOsdGeometryTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/PixelOsdStatusTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/PixelOsdSpriteCoverageTest.kt \
            CamUI-src/app/src/test/java/com/example/camui/ZoomHapticMilestonesTest.kt \
            CamUI-src/i18n_whitelist.txt \
            GLOSSARY.md

      - name: Upload complete source files
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: LunaDream-2.5.0dream-source-files
          path: source-artifacts/LunaDream-2.5.0dream-source-files.zip
          if-no-files-found: error
          retention-days: 30
