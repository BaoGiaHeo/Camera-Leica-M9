name: LunaDream UI compile and test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lunadream-2.5.0dream

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile and run unit tests
        run: gradle -p CamUI-src testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaDream-2.5.0dream-ui-debug
          path: CamUI-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Package complete modified Kotlin source files
        if: always() && !cancelled()
        run: |
          mkdir -p source-artifacts
          zip -j -q source-artifacts/LunaDream-2.5.0dream-source-files.zip \
            CamUI-src/app/src/main/java/com/example/camui/CameraScreen.kt \
            CamUI-src/app/src/main/java/com/example/camui/MainActivity.kt \
            CamUI-src/app/src/main/java/com/example/camui/NightShotProcessor.kt \
            CamUI-src/app/src/main/java/com/example/camui/SettingsScreen.kt \
            CamUI-src/app/src/main/java/com/example/camui/UtilityScreens.kt \
            CamUI-src/app/src/main/java/com/example/camui/Components.kt \
            CamUI-src/app/src/main/java/com/example/camui/LunaDreamProcessingScope.kt \
            CamUI-src/app/src/main/java/com/example/camui/BackupSettings.kt \
            CamUI-src/app/src/main/java/com/example/camui/FujiSkin.kt \
            CamUI-src/app/build.gradle.kts

      - name: Upload complete source files
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: LunaDream-2.5.0dream-source-files
          path: source-artifacts/LunaDream-2.5.0dream-source-files.zip
          if-no-files-found: error
          retention-days: 30
