name: Build LunaDream Debug and Developer APKs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lunadream-2.5.0dream
    paths:
      - "CamUI-src/**"
      - ".github/workflows/build-lunadream-variants.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 37 and build tools
        run: |
          yes | sdkmanager --licenses --channel=3 >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug and Developer APKs
        working-directory: CamUI-src
        run: gradle --no-daemon :app:assembleDebug :app:assembleDeveloper --stacktrace

      - name: Run unit tests for both variants
        working-directory: CamUI-src
        run: gradle --no-daemon :app:testDebugUnitTest :app:testDeveloperUnitTest --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaDream-2.5.0dream-Debug
          path: CamUI-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Developer APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaDream-2.5.0dream-Developer
          path: CamUI-src/app/build/outputs/apk/developer/app-developer.apk
          if-no-files-found: error
          retention-days: 14
