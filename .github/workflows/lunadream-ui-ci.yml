name: LunaDream UI compile and test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lunadream-2.5.0dream

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile and run unit tests
        run: gradle -p CamUI-src testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaDream-2.5.0dream-ui-debug
          path: CamUI-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
