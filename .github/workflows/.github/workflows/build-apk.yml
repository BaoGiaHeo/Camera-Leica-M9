name: Build Fujifilm Mode APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Apktool
        run: |
          curl -L --fail -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Extract project
        run: |
          mkdir decoded
          unzip -q app.zip -d decoded
          test -d decoded/app
          mv decoded/app app

      - name: Build APK
        run: |
          mkdir -p output
          java -Xmx4g -jar apktool.jar b app \
            -o output/Fujifilm-Mode-unsigned.apk

      - name: Download APK signer
        run: |
          curl -L --fail -o uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Generate signing key and sign
        run: |
          keytool -genkeypair -v \
            -keystore temporary-release.jks \
            -storepass temporary123 \
            -keypass temporary123 \
            -alias temporary \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Fujifilm Mode, O=Local Build, C=VN"

          java -jar uber-apk-signer.jar \
            -a output/Fujifilm-Mode-unsigned.apk \
            -o output/signed \
            --ks temporary-release.jks \
            --ksAlias temporary \
            --ksPass temporary123 \
            --ksKeyPass temporary123

      - name: Prepare APK
        run: |
          cp output/signed/*signed.apk output/Fujifilm-Mode-release.apk
          sha256sum output/Fujifilm-Mode-release.apk > output/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fujifilm-Mode-release
          path: |
            output/Fujifilm-Mode-release.apk
            output/SHA256SUMS.txt
            
