name: Audit Fujifilm app source
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.zip'
      - '.github/workflows/audit-source.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract decoded APK project
        run: |
          mkdir -p decoded
          unzip -q app.zip -d decoded
          PROJECT_DIR=$(find decoded -type f -name apktool.yml -print -quit | xargs dirname)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Inspect settings, UI and camera source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["PROJECT_DIR"])
          main=root/"smali_classes3/com/xcam/offline/MainActivity.smali"
          lines=main.read_text(errors="ignore").splitlines()
          def dump_file(path, ranges=None):
              src=path.read_text(errors="ignore").splitlines()
              print(f"=== FILE {path.relative_to(root)} ({len(src)} lines) ===")
              if ranges is None:
                  for n,line in enumerate(src,1): print(f"{n}: {line}")
              else:
                  for a,b in ranges:
                      print(f"--- lines {a}-{b} ---")
                      for n in range(a,min(b,len(src))+1): print(f"{n}: {src[n-1]}")
          print("=== MAIN ACTIVITY METHOD INDEX ===")
          for i,line in enumerate(lines,1):
              if line.startswith(".method "):
                  print(f"{i}: {line}")
          for name in ("loadSettings","saveSettings","resolveNoiseReductionMode"):
              start=next((i for i,x in enumerate(lines) if x.startswith(".method ") and (" "+name+"(") in x),None)
              if start is not None:
                  end=next((j for j in range(start+1,len(lines)) if lines[j]==".end method"),start)
                  print(f"=== METHOD {name} ===")
                  for n in range(start,end+1): print(f"{n+1}: {lines[n]}")
          # Summarize all visible strings in buildUi to map the existing controls.
          start=next(i for i,x in enumerate(lines) if x==".method private final buildUi()V")
          end=next(i for i in range(start+1,len(lines)) if lines[i]==".end method")
          print("=== BUILD UI STRINGS AND VIEW CONSTRUCTION ===")
          for n in range(start,end):
              line=lines[n]
              if any(k in line for k in ("const-string","new-instance","->setText(","->setTextSize(","->setTextColor(","->setBackground","->addView(","->setOnClickListener","->setPadding(","->setGravity(")):
                  print(f"{n+1}: {line}")
          for rel in ("smali_classes3/com/xcam/offline/AppSettingsStore.smali","smali_classes3/com/xcam/offline/ExtraCameraSettings.smali"):
              p=root/rel
              if p.exists(): dump_file(p)
          PY
