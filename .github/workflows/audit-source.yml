name: Audit Fujifilm app source
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.zip'
      - '.github/workflows/audit-source.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract decoded APK project
        run: |
          mkdir -p decoded
          unzip -q app.zip -d decoded
          PROJECT_DIR=$(find decoded -type f -name apktool.yml -print -quit | xargs dirname)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Dump denoise controls and event handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ["PROJECT_DIR"])
          p=root/"smali_classes3/com/xcam/offline/MainActivity.smali"
          lines=p.read_text(errors="ignore").splitlines()
          def dump(a,b):
              print(f"=== SOURCE LINES {a}-{b} ===")
              for n in range(a,min(b,len(lines))+1): print(f"{n}: {lines[n-1]}")
          dump(14955,15250)
          dump(15955,16470)
          print("=== DENOISE FIELD DECLARATION AND ALL USES ===")
          for n,line in enumerate(lines,1):
              if "denoiseMode" in line or "NOISE_REDUCTION_MODE" in line:
                  print(f"{n}: {line}")
          PY
