name: CamUI PR compile and unit-test check

'on':
  pull_request:
    paths:
      - 'CamUI-src/**'
      - '.github/workflows/camui-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 platform 37.0
        run: |
          yes | sdkmanager --licenses --channel=3 >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build CamUI debug APK
        run: gradle -p CamUI-src testDebugUnitTest assembleDebug --no-daemon --stacktrace

