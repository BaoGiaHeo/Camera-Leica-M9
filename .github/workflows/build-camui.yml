name: Build FujiFilm Mode 2.0.2Dream
# Release pipeline for the portrait UI and LunaDream 2.0.1 capture paths.

on:
  push:
    branches: [main, "feature/fujifilm-mode-1.6"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and build debug + release APKs
        id: build_apks
        working-directory: CamUI-src
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify APK metadata and absence of bundled AI models
        working-directory: CamUI-src
        run: |
          python - <<'PY'
          import glob
          import zipfile

          debug_apks = glob.glob("app/build/outputs/apk/debug/*.apk")
          release_apks = glob.glob("app/build/outputs/apk/release/*.apk")
          assert debug_apks, "Debug APK was not produced"
          assert release_apks, "Release APK was not produced"
          for path in debug_apks + release_apks:
              with zipfile.ZipFile(path) as apk:
                  names = set(apk.namelist())
                  forbidden = [name for name in names if "nafnet" in name.lower() or "onnx" in name.lower()]
                  assert not forbidden, f"AI model payload still present in {path}: {forbidden}"
              print(f"Verified {path}")
          PY
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Cold-start smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Use the stable Google APIs image and wait for Android framework services,
          # not merely for the ADB transport, before attempting APK installation.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          script: |
            set -eu
            mkdir -p emulator-artifacts
            : > emulator-artifacts/command-status.txt

            timeout 60s adb wait-for-device > emulator-artifacts/adb-wait.txt 2>&1
            echo "wait_for_device=0" >> emulator-artifacts/command-status.txt

            # adb wait-for-device can return before PackageManager/ActivityManager are ready.
            ready=0
            for i in $(seq 1 90); do
              boot="$(adb shell getprop sys.boot_completed 2>&1 | tr -d '\r' || true)"
              package_service="$(adb shell service check package 2>&1 | tr -d '\r' || true)"
              activity_service="$(adb shell service check activity 2>&1 | tr -d '\r' || true)"
              printf 'attempt=%s boot=%s package=%s activity=%s\n' "$i" "$boot" "$package_service" "$activity_service" >> emulator-artifacts/boot-readiness.txt
              if [ "$boot" = "1" ] && printf '%s' "$package_service" | grep -q found && printf '%s' "$activity_service" | grep -q found; then
                ready=1
                break
              fi
              sleep 4
            done

            adb shell getprop > emulator-artifacts/getprop.txt 2>&1 || true
            adb shell service list > emulator-artifacts/services.txt 2>&1 || true
            if [ "$ready" -ne 1 ]; then
              echo "Android framework services did not become ready; app was not installed/launched." > emulator-artifacts/boot-failure.txt
              adb logcat -b all -d -v threadtime -t 15000 > emulator-artifacts/logcat-boot-failure.txt 2>&1 || true
              adb shell ps -A > emulator-artifacts/processes-boot-failure.txt 2>&1 || true
              echo "framework_ready=0" >> emulator-artifacts/command-status.txt
              exit 21
            fi
            echo "framework_ready=1" >> emulator-artifacts/command-status.txt

            adb install -r CamUI-src/app/build/outputs/apk/debug/app-debug.apk > emulator-artifacts/install.txt 2>&1
            echo "install=0" >> emulator-artifacts/command-status.txt
            adb shell pm grant com.fujifilm.mode.debug android.permission.CAMERA > emulator-artifacts/permission.txt 2>&1
            adb logcat -c
            adb shell am force-stop com.fujifilm.mode.debug > emulator-artifacts/force-stop.txt 2>&1
            adb shell am start -W -n com.fujifilm.mode.debug/com.example.camui.MainActivity > emulator-artifacts/start-result.txt 2>&1
            echo "am_start=0" >> emulator-artifacts/command-status.txt
            sleep 15

            adb shell pidof com.fujifilm.mode.debug > emulator-artifacts/app-pid.txt 2>&1 || true
            adb shell dumpsys activity activities > emulator-artifacts/activity-portrait.txt 2>&1 || true
            adb exec-out screencap -p > emulator-artifacts/camera-portrait.png 2> emulator-artifacts/screencap-portrait-error.txt || true
            adb logcat -d -v threadtime -t 12000 > emulator-artifacts/logcat-portrait.txt 2>&1 || true

            # Exercise orientation only after a successful cold launch.
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 5
            adb shell dumpsys activity activities > emulator-artifacts/activity-landscape.txt 2>&1 || true
            adb exec-out screencap -p > emulator-artifacts/camera-landscape.png 2> emulator-artifacts/screencap-landscape-error.txt || true
            adb shell pidof com.fujifilm.mode.debug > emulator-artifacts/app-pid-landscape.txt 2>&1 || true
            adb logcat -d -v threadtime -t 16000 > emulator-artifacts/logcat-landscape.txt 2>&1 || true

            # Keep raw logs even when startup fails; report app crash signatures separately.
            if grep -Eq 'FATAL EXCEPTION|Fatal signal [0-9]+|am_crash|Process: com\.fujifilm\.mode' emulator-artifacts/logcat-landscape.txt; then
              echo "app_crash_signature=1" >> emulator-artifacts/command-status.txt
              exit 22
            fi
            if [ ! -s emulator-artifacts/app-pid.txt ]; then
              echo "app_process_missing_after_launch=1" >> emulator-artifacts/command-status.txt
              exit 23
            fi
            echo "app_process_alive=1" >> emulator-artifacts/command-status.txt

            # Run instrumentation only after the plain install + cold start was observed.
            gradle --no-daemon -p CamUI-src :app:connectedDebugAndroidTest --stacktrace --console=plain
            adb logcat -d -v threadtime -t 20000 > emulator-artifacts/logcat-final.txt 2>&1 || true

      - name: Upload emulator inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-inspection
          path: emulator-artifacts/
          if-no-files-found: warn

      - name: Upload 2.0.2Dream APKs
        if: always() && steps.build_apks.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FujiFilm-Mode-2.0.2Dream
          path: |
            CamUI-src/app/build/outputs/apk/debug/*.apk
            CamUI-src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
