name: Build FujiFilm Mode 2.0.2Dream
# Release pipeline for the portrait UI and LunaDream 2.0.1 capture paths.

on:
  push:
    branches: [main, "feature/fujifilm-mode-1.6"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and build debug + release APKs
        id: build_apks
        working-directory: CamUI-src
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify APK metadata and absence of bundled AI models
        working-directory: CamUI-src
        run: |
          python - <<'PY'
          import glob
          import zipfile

          debug_apks = glob.glob("app/build/outputs/apk/debug/*.apk")
          release_apks = glob.glob("app/build/outputs/apk/release/*.apk")
          assert debug_apks, "Debug APK was not produced"
          assert release_apks, "Release APK was not produced"
          for path in debug_apks + release_apks:
              with zipfile.ZipFile(path) as apk:
                  names = set(apk.namelist())
                  forbidden = [name for name in names if "nafnet" in name.lower() or "onnx" in name.lower()]
                  assert not forbidden, f"AI model payload still present in {path}: {forbidden}"
              print(f"Verified {path}")
          PY
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Cold-start smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          script: |
            mkdir -p emulator-artifacts

            # Bound every ADB operation so an unresponsive emulator cannot stall the whole job.
            sh -c 'timeout 60s adb wait-for-device > emulator-artifacts/adb-wait.txt 2>&1; rc=$?; echo "wait_for_device=$rc" >> emulator-artifacts/command-status.txt'
            sh -c 'timeout 90s adb install -r CamUI-src/app/build/outputs/apk/debug/app-debug.apk > emulator-artifacts/install.txt 2>&1; rc=$?; echo "install=$rc" >> emulator-artifacts/command-status.txt'
            sh -c 'timeout 20s adb shell pm grant com.fujifilm.mode.debug android.permission.CAMERA > emulator-artifacts/permission.txt 2>&1; rc=$?; echo "camera_permission=$rc" >> emulator-artifacts/command-status.txt'
            sh -c 'timeout 20s adb logcat -c > emulator-artifacts/logcat-clear.txt 2>&1; rc=$?; echo "logcat_clear=$rc" >> emulator-artifacts/command-status.txt'
            sh -c 'timeout 20s adb shell am force-stop com.fujifilm.mode.debug > emulator-artifacts/force-stop.txt 2>&1; rc=$?; echo "force_stop=$rc" >> emulator-artifacts/command-status.txt'
            sh -c 'timeout 45s adb shell am start -W -n com.fujifilm.mode.debug/com.example.camui.MainActivity > emulator-artifacts/start-result.txt 2>&1; rc=$?; echo "am_start=$rc" >> emulator-artifacts/command-status.txt'
            sleep 8
            sh -c 'timeout 30s adb shell dumpsys activity activities > emulator-artifacts/activity-portrait.txt 2>&1; rc=$?; echo "dumpsys_portrait=$rc" >> emulator-artifacts/command-status.txt'
            sh -c 'timeout 30s adb exec-out screencap -p > emulator-artifacts/camera-portrait.png; rc=$?; echo "screencap_portrait=$rc" >> emulator-artifacts/command-status.txt'
            sh -c 'timeout 30s adb logcat -d -v threadtime -t 5000 > emulator-artifacts/logcat-portrait.txt 2>&1; rc=$?; echo "logcat_portrait=$rc" >> emulator-artifacts/command-status.txt'

            # Force landscape and record whether the activity follows the display configuration.
            sh -c 'timeout 20s adb shell settings put system accelerometer_rotation 0; rc=$?; echo "disable_auto_rotation=$rc" >> emulator-artifacts/command-status.txt'
            sh -c 'timeout 20s adb shell settings put system user_rotation 1; rc=$?; echo "set_landscape_rotation=$rc" >> emulator-artifacts/command-status.txt'
            sleep 5
            sh -c 'timeout 30s adb shell dumpsys activity activities > emulator-artifacts/activity-landscape.txt 2>&1; rc=$?; echo "dumpsys_landscape=$rc" >> emulator-artifacts/command-status.txt'
            sh -c 'timeout 30s adb exec-out screencap -p > emulator-artifacts/camera-landscape.png; rc=$?; echo "screencap_landscape=$rc" >> emulator-artifacts/command-status.txt'
            sh -c 'timeout 30s adb logcat -d -v threadtime -t 5000 > emulator-artifacts/logcat-landscape.txt 2>&1; rc=$?; echo "logcat_landscape=$rc" >> emulator-artifacts/command-status.txt'

            # Keep the instrumentation result as the final command's exit status.
            sh -c 'timeout 240s gradle --no-daemon -p CamUI-src :app:connectedDebugAndroidTest --stacktrace --console=plain; test_status=$?; timeout 30s adb logcat -d -v threadtime -t 10000 > emulator-artifacts/logcat-final.txt 2>&1; exit "$test_status"'

      - name: Upload emulator inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-inspection
          path: emulator-artifacts/
          if-no-files-found: warn

      - name: Upload 2.0.2Dream APKs
        if: always() && steps.build_apks.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FujiFilm-Mode-2.0.2Dream
          path: |
            CamUI-src/app/build/outputs/apk/debug/*.apk
            CamUI-src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
