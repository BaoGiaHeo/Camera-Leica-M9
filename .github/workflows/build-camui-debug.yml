name: Build Fujifilm Mode CameraX debug APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CamUI-src/**'
      - '.github/workflows/build-camui-debug.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build app-debug.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install NDK/CMake and provision NCNN Vulkan + Real-ESRGAN x2 model
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.22.1"

          NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$NDK_DIR"
          WORK_DIR="$RUNNER_TEMP/fuji-ncnn"
          mkdir -p "$WORK_DIR"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/Tencent/ncnn/releases/download/20261020/ncnn-20261020-android-vulkan-shared.zip" \
            -o "$WORK_DIR/ncnn-android-vulkan.zip"
          unzip -q "$WORK_DIR/ncnn-android-vulkan.zip" -d "$WORK_DIR/unpacked"

          NCNN_SO="$(find "$WORK_DIR/unpacked" -type f -name libncnn.so | grep '/arm64-v8a/' | head -n 1 || true)"
          NCNN_NET_H="$(find "$WORK_DIR/unpacked" -type f -name net.h | head -n 1 || true)"
          echo "NCNN shared library: ${NCNN_SO:-NOT FOUND}"
          echo "NCNN net.h: ${NCNN_NET_H:-NOT FOUND}"
          if [ -z "$NCNN_NET_H" ]; then
            echo "Prebuilt archive has no standalone headers; extracting public headers from the matching NCNN source release."
            curl -fL --retry 3 --retry-delay 2 \
              "https://github.com/Tencent/ncnn/releases/download/20261020/ncnn-20261020-full-source.zip" \
              -o "$WORK_DIR/ncnn-full-source.zip"
            unzip -q "$WORK_DIR/ncnn-full-source.zip" -d "$WORK_DIR/source"
            NCNN_NET_H="$(find "$WORK_DIR/source" -type f -path '*/src/net.h' | head -n 1 || true)"
          fi
          test -s "$NCNN_SO"
          test -s "$NCNN_NET_H"

          MAIN_DIR="CamUI-src/app/src/main"
          CPP_DIR="$MAIN_DIR/cpp"
          JNI_DIR="$MAIN_DIR/jniLibs/arm64-v8a"
          mkdir -p "$CPP_DIR/third_party/ncnn/include" "$JNI_DIR" "$MAIN_DIR/assets"
          HEADER_DIR="$(dirname "$NCNN_NET_H")"
          find "$HEADER_DIR" -maxdepth 1 -type f \( -name '*.h' -o -name '*.hpp' \) -exec cp {} "$CPP_DIR/third_party/ncnn/include/" \;
          NCNN_LIB_DIR="$(dirname "$NCNN_SO")"
          find "$NCNN_LIB_DIR" -maxdepth 1 -type f -name '*.so*' -exec cp {} "$JNI_DIR/" \;
          cp "$NCNN_SO" "$JNI_DIR/libncnn.so"

          NCNN_CXX="$(find "$WORK_DIR/unpacked" -type f -name libc++_shared.so | head -n 1 || true)"
          if [ -z "$NCNN_CXX" ]; then
            NCNN_CXX="$(find "$NDK_DIR" -type f -path '*/aarch64-linux-android/libc++_shared.so' | head -n 1 || true)"
          fi
          test -s "$NCNN_CXX"
          cp "$NCNN_CXX" "$JNI_DIR/libc++_shared.so"
          echo "Prepared NCNN headers and ABI libraries:"
          ls -lh "$CPP_DIR/third_party/ncnn/include" "$JNI_DIR"

          MODEL_DIR="$MAIN_DIR/assets"
          HF_BASE="https://huggingface.co/edgetools/realesrgan/resolve/b8b8b5d"
          curl -fL --retry 3 "$HF_BASE/realesr-animevideov3-x2.param?download=true" \
            -o "$MODEL_DIR/realesr-animevideov3-x2.param"
          curl -fL --retry 3 "$HF_BASE/realesr-animevideov3-x2.bin?download=true" \
            -o "$MODEL_DIR/realesr-animevideov3-x2.bin"
          test -s "$MODEL_DIR/realesr-animevideov3-x2.param"
          test -s "$MODEL_DIR/realesr-animevideov3-x2.bin"
          cat > "$MODEL_DIR/REAL_ESRGAN_MODEL_NOTICE.txt" <<'NOTICE'
          Real-ESRGAN NCNN animevideov3 x2 model
          Model files are pinned to Hugging Face revision b8b8b5d of edgetools/realesrgan.
          Upstream model family: xinntao/Real-ESRGAN-ncnn-vulkan, NCNN model format.
          License: BSD-3-Clause. See https://github.com/xinntao/Real-ESRGAN/blob/master/LICENSE
          NOTICE
          echo "NCNN and model files provisioned:"
          ls -lh "$JNI_DIR" "$MODEL_DIR"/realesr-animevideov3-x2.*

      - name: Build debug APK
        working-directory: CamUI-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: |
          APK='CamUI-src/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          sha256sum "$APK" | tee CamUI-src/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload Fujifilm Mode app-debug
        uses: actions/upload-artifact@v4
        with:
          name: Fujifilm-Mode-app-debug
          path: |
            CamUI-src/app/build/outputs/apk/debug/app-debug.apk
            CamUI-src/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

# Rebuild after the landscape EXIF/CameraX normalization and watermark-status fixes.
