name: Build Fujifilm Mode APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Apktool
        run: |
          curl -L --fail --retry 3 -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Build unsigned APK
        run: |
          mkdir -p output
          java -Xmx4g -jar apktool.jar b app -o output/Fujifilm-Mode-unsigned.apk

      - name: Download APK signer
        run: |
          curl -L --fail --retry 3 -o uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            java -jar uber-apk-signer.jar \
              -a output/Fujifilm-Mode-unsigned.apk \
              -o output/signed \
              --ks release.jks \
              --ksAlias "$KEY_ALIAS" \
              --ksPass "$KEYSTORE_PASSWORD" \
              --ksKeyPass "$KEY_PASSWORD"
          else
            keytool -genkeypair -v \
              -keystore temporary-release.jks \
              -storepass temporary123 \
              -keypass temporary123 \
              -alias temporary \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=Fujifilm Mode Local Build, O=Local Build, C=VN"
            java -jar uber-apk-signer.jar \
              -a output/Fujifilm-Mode-unsigned.apk \
              -o output/signed \
              --ks temporary-release.jks \
              --ksAlias temporary \
              --ksPass temporary123 \
              --ksKeyPass temporary123
          fi

      - name: Rename final APK
        run: |
          cp output/signed/*signed.apk output/Fujifilm-Mode-release.apk
          sha256sum output/Fujifilm-Mode-release.apk | tee output/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fujifilm-Mode-release
          path: |
            output/Fujifilm-Mode-release.apk
            output/SHA256SUMS.txt
