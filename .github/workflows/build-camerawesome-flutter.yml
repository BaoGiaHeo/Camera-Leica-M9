name: Build Fujifilm Mode CamerAwesome Flutter (app-debug)

'on':
  push:
    branches: [main]
    paths:
      - 'camerawesome_flutter/**'
      - '.github/workflows/build-camerawesome-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          set -e
          flutter create --org com.fujifilm.mode --project-name fujifilm_camerawesome --platforms=android --android-language kotlin build/CamAwesomeFlutter
          cp camerawesome_flutter/pubspec.yaml build/CamAwesomeFlutter/pubspec.yaml
          cp camerawesome_flutter/lib/main.dart build/CamAwesomeFlutter/lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("build/CamAwesomeFlutter/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, n = re.subn(r'android:label="[^"]*"', 'android:label="Fujifilm Mode (app-debug)"', s, count=1)
          if n != 1:
              raise SystemExit("Could not set Fujifilm debug app label")
          if "android.permission.CAMERA" not in s:
              s = s.replace("<application", '    <uses-permission android:name="android.permission.CAMERA" />\\n    <application', 1)
          p.write_text(s)
          PY

      - name: Resolve Flutter dependencies
        working-directory: build/CamAwesomeFlutter
        run: flutter pub get

      - name: Build Flutter debug APK
        working-directory: build/CamAwesomeFlutter
        run: flutter build apk --debug

      - name: Upload Flutter debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fujifilm-Mode-CamerAwesome-Flutter-app-debug
          path: build/CamAwesomeFlutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
